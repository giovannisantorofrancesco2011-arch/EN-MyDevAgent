# MyDevAgent Studio, English edition: on every push to this branch, builds and tests the extension, builds the
# Windows installer (VSCodium + MyDevAgent) and publishes it in the "studio-en" release (recreated on every run).
# It never touches the Italian edition's releases and is never marked as the latest release.
name: MyDevAgent Studio (English)

on:
  push:
    branches: [EN-Studio]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-en
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extension (compile, test, package)
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npm test
          npm run package

      - name: Studio (VSCodium + extension + installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./studio/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MyDevAgent-Studio-EN
          path: build/out/*

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          $tag = "studio-en"
          gh release delete $tag --cleanup-tag --yes 2>$null
          gh release create $tag build/out/MyDevAgent-Studio-Setup-EN.exe build/out/mydevagent-en.vsix `
            --target $env:GITHUB_SHA --latest=false --title "MyDevAgent Studio (English) $version" --notes-file studio/NOTE.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
