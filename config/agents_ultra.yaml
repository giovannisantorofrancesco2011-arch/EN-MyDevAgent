# =====================================================================
#  The 20 extended agents (16-35): used only in /ultra-deep (or when you mention them with @alias)
#  Same fields as agents.yaml. Extra stage: judge (Chief Integrator).
# =====================================================================

agents:
  - id: 16
    key: requirements
    name: "Requirements Analyst"
    stage: plan
    role: "Turns the request into clear requirements: user stories, acceptance criteria, use cases, constraints, what is out of scope."
    goal: "Remove ambiguity before design."
    prompt: 16_requirements.md
    tier: reasoning
    max_tokens: 700
    temperature: 0.2
    reads: [request, history, files, rag, research, image_notes]
    keywords: [requisiti, requirements, user story, specifica, specification, casi d'uso, use case, mvp]
    aliases: [req, requirements]

  - id: 17
    key: api_design
    name: "API Designer"
    stage: specialist
    role: "API contracts: OpenAPI/GraphQL schemas, naming, versioning, pagination, errors, idempotency, compatibility."
    goal: "Consistent, evolvable and easy-to-use APIs."
    prompt: 17_api_design.md
    tier: main
    max_tokens: 1200
    temperature: 0.1
    reads: [request, history, files, rag, plan, research, issues]
    keywords: [openapi, swagger, contratto, contract, versioning, api design, graphql schema, rest design, endpoint design]
    aliases: [apidesign, openapi]

  - id: 18
    key: mobile
    name: "Mobile"
    stage: specialist
    role: "Mobile apps: React Native/Expo, Flutter, Swift/SwiftUI, Kotlin/Jetpack Compose, offline, permissions, stores."
    goal: "Smooth mobile apps that behave natively and are ready for the stores."
    prompt: 18_mobile.md
    tier: main
    max_tokens: 1400
    temperature: 0.2
    reads: [request, history, files, rag, plan, research, issues, image_notes]
    keywords: [mobile, ios, android, react native, expo, flutter, swiftui, jetpack, kotlin app, app store, play store]
    aliases: [mobile, ios, android]

  - id: 19
    key: cloud
    name: "Cloud Architect"
    stage: specialist
    role: "Cloud architecture: AWS/GCP/Azure, serverless, networking, IAM, storage, costs, high availability."
    goal: "Secure, reliable infrastructure with costs under control."
    prompt: 19_cloud.md
    tier: main
    max_tokens: 1200
    temperature: 0.1
    reads: [request, history, files, rag, plan, research, issues]
    keywords: [aws, gcp, azure, lambda, serverless, s3, iam, vpc, cloud run, cloudformation, cdk, costi cloud, cloud cost]
    aliases: [cloud, aws]

  - id: 20
    key: data
    name: "Data Engineer"
    stage: specialist
    role: "Data pipelines: ETL/ELT, batch and streaming, Spark, dbt, Airflow, Kafka, data quality and schemas."
    goal: "Correct, idempotent and traceable data across the whole pipeline."
    prompt: 20_data.md
    tier: main
    max_tokens: 1200
    temperature: 0.1
    reads: [request, history, files, rag, plan, research, issues]
    keywords: [etl, elt, pipeline dati, data pipeline, spark, dbt, airflow, kafka, streaming, pandas, polars, data warehouse, bigquery]
    aliases: [data, etl]

  - id: 21
    key: ai_ml
    name: "AI/ML Engineer"
    stage: specialist
    role: "Model integration: LLMs, RAG, embeddings, fine-tuning, evaluation, classic ML, efficient inference."
    goal: "Reliable, measurable and cost-effective AI features."
    prompt: 21_ai_ml.md
    tier: main
    max_tokens: 1200
    temperature: 0.2
    reads: [request, history, files, rag, plan, research, issues]
    keywords: [llm, rag, embedding, embeddings, machine learning, ml, pytorch, tensorflow, fine-tuning, prompt, openai, ollama, modello ai, ai model]
    aliases: [ai, ml]

  - id: 22
    key: concurrency
    name: "Concurrency & Async"
    stage: specialist
    role: "Threads, async/await, locks, queues, race conditions, deadlocks, backpressure, cancellation."
    goal: "Correct concurrent code, free of races and deadlocks."
    prompt: 22_concurrency.md
    tier: reasoning
    max_tokens: 900
    temperature: 0.0
    reads: [request, plan, artifacts, issues]
    keywords: [thread, threading, async, await, asyncio, concorrenza, concurrency, lock, mutex, race, deadlock, goroutine, parallel]
    aliases: [async, concurrency]

  - id: 23
    key: systems
    name: "Systems & Low-level"
    stage: specialist
    role: "C, C++, Rust, memory, pointers, ownership, FFI, low-level performance, embedded."
    goal: "Memory-safe and deterministic systems code."
    prompt: 23_systems.md
    tier: main
    max_tokens: 1200
    temperature: 0.1
    reads: [request, history, files, rag, plan, research, issues]
    keywords: ["c++", " c ", rust, unsafe, puntatori, pointer, memoria, memory leak, ffi, embedded, kernel, cmake]
    aliases: [systems, lowlevel]

  - id: 24
    key: a11y_i18n
    name: "Accessibility & i18n"
    stage: gate
    role: "WCAG 2.2, screen readers, keyboard, contrast; internationalization, locale formats, RTL, translatable text."
    goal: "Products usable by everyone, in every language."
    prompt: 24_a11y_i18n.md
    tier: reasoning
    max_tokens: 500
    temperature: 0.0
    reads: [request, plan, artifacts]
    keywords: [accessibilità, accessibility, a11y, wcag, screen reader, i18n, internazionalizzazione, traduzioni, locale, rtl]
    aliases: [a11y, i18n]

  - id: 25
    key: ux_ui
    name: "UX/UI Designer"
    stage: specialist
    role: "Design systems, visual hierarchy, user flows, empty/error states, micro-interactions, consistency."
    goal: "Clear, consistent and pleasant interfaces."
    prompt: 25_ux_ui.md
    tier: main
    max_tokens: 1000
    temperature: 0.3
    reads: [request, history, files, plan, research, issues, image_notes]
    keywords: [ux, design system, user experience, usabilità, usability, figma, flusso utente, user flow, onboarding, dashboard design]
    aliases: [ux, design]

  - id: 26
    key: observability
    name: "Observability"
    stage: gate
    role: "Structured logs, metrics, tracing (OpenTelemetry), health checks, alerts, error tracking."
    goal: "Understand what is happening in production and why, within minutes."
    prompt: 26_observability.md
    tier: reasoning
    max_tokens: 500
    temperature: 0.0
    reads: [request, plan, artifacts]
    keywords: [log, logging, metriche, metrics, tracing, opentelemetry, sentry, alert, monitoring, osservabilità, observability]
    aliases: [obs, observability]

  - id: 27
    key: dependencies
    name: "Dependencies & Supply Chain"
    stage: research
    role: "Library versions, compatibility, licenses, known CVEs, pinning, lockfiles, abandoned dependencies."
    goal: "Only up-to-date, secure dependencies with compatible licenses."
    prompt: 27_dependencies.md
    tier: main
    max_tokens: 600
    temperature: 0.0
    reads: [request, plan, artifacts, research]
    keywords: [dipendenze, dependencies, versione, version, licenza, license, cve, npm audit, pip-audit, lockfile, upgrade]
    aliases: [deps, dependencies]

  - id: 28
    key: migration
    name: "Migrations & Legacy"
    stage: specialist
    role: "Large-scale refactoring, framework/version migrations, strangler pattern, backward compatibility."
    goal: "Change existing systems without breaking anything."
    prompt: 28_migration.md
    tier: main
    max_tokens: 1200
    temperature: 0.1
    reads: [request, history, files, rag, plan, research, issues]
    keywords: [migra, migrate, migration, legacy, upgrade, aggiorna a, porting, deprecat, refactoring grande, strangler]
    aliases: [migration, legacy]

  - id: 29
    key: test_strategy
    name: "Test Strategist"
    stage: test
    role: "Test strategy: pyramid, unit/integration/e2e, property-based, fixtures, mocks, risk coverage."
    goal: "Few tests, the right ones, that catch the real bugs."
    prompt: 29_test_strategy.md
    tier: reasoning
    max_tokens: 700
    temperature: 0.1
    reads: [request, plan, artifacts, test_report]
    keywords: [strategia di test, test strategy, e2e, end-to-end test, integration test, copertura, coverage, property-based, playwright, cypress]
    aliases: [teststrategy, qa]

  - id: 30
    key: threat_model
    name: "Threat Modeling & Privacy"
    stage: gate
    role: "Threat model (STRIDE), attack surface, personal data, GDPR, retention, encryption, audit logs."
    goal: "Security and privacy risks identified and mitigated by design."
    prompt: 30_threat_model.md
    tier: reasoning
    max_tokens: 600
    temperature: 0.0
    reads: [request, plan, artifacts, research]
    keywords: [threat model, stride, gdpr, privacy, dati personali, personal data, pii, compliance, audit log, cifratura]
    aliases: [threat, privacy, gdpr]

  - id: 31
    key: scalability
    name: "Scalability & Load"
    stage: gate
    role: "Capacity planning, bottlenecks, caching, sharding, rate limiting, queues, load testing."
    goal: "The system handles 10x the expected load without surprises."
    prompt: 31_scalability.md
    tier: reasoning
    max_tokens: 500
    temperature: 0.0
    reads: [request, plan, artifacts, test_report]
    keywords: [scalabilità, scalability, carico, load, milioni di utenti, million users, rate limit, sharding, high traffic, capacity]
    aliases: [scale, load]

  - id: 32
    key: release
    name: "Release & Versioning"
    stage: docs
    role: "Semver, changelogs, release notes, packaging, release migrations, rollback."
    goal: "Every release is understandable, reversible and free of surprises for its users."
    prompt: 32_release.md
    tier: main
    max_tokens: 500
    temperature: 0.1
    reads: [request, plan, artifacts]
    keywords: [release, rilascio, changelog, semver, versioning, pubblica, publish, packaging, tag]
    aliases: [release, changelog]

  - id: 33
    key: fact_checker
    name: "Web Fact-checker"
    stage: gate
    role: "Checks against official sources (online) that the APIs, flags, versions and libraries used exist and are used correctly."
    goal: "Zero invented or deprecated APIs in the delivered code."
    prompt: 33_fact_checker.md
    tier: reasoning
    max_tokens: 600
    temperature: 0.0
    reads: [request, artifacts, research]
    keywords: [verifica, verify, fact check, documentazione ufficiale, official docs, deprecated, deprecato]
    aliases: [factcheck, verify]

  - id: 34
    key: devils_advocate
    name: "Devil's Advocate"
    stage: plan
    role: "Challenges the plan: weak assumptions, simpler alternatives, ignored risks, over-engineering."
    goal: "A plan that has withstood the best objections."
    prompt: 34_devils_advocate.md
    tier: reasoning
    max_tokens: 500
    temperature: 0.3
    reads: [request, plan, research]
    keywords: [alternative, alternativa, pro e contro, trade-off, tradeoff, critica, critique]
    aliases: [devil, critic]

  - id: 35
    key: integrator
    name: "Chief Integrator"
    stage: judge
    role: "Merges the results of all quality gates, removes duplicates and false positives, decides what to fix and in what order."
    goal: "A single, prioritized and actionable list of fixes."
    prompt: 35_integrator.md
    tier: reasoning
    max_tokens: 700
    temperature: 0.0
    reads: [request, plan, artifacts, test_report, issues]
    keywords: []
    aliases: [integrator, judge]
