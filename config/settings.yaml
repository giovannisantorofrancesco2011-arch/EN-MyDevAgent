# =====================================================================
#  MyDevAgent — main configuration
#  Every value can be overridden by environment variables (.env):
#    MYDEVAGENT_PROFILE, LLM_BASE_URL, LLM_API_KEY, MYDEVAGENT_MODEL_<TIER>
# =====================================================================

# Active hardware profile: cpu | gpu8 | gpu16 | gpu24
profile: gpu8

# OpenAI-compatible LLM servers. They all expose /v1/chat/completions.
backends:
  ollama:   { base_url: "http://localhost:11434/v1", api_key: "ollama" }
  lmstudio: { base_url: "http://localhost:1234/v1",  api_key: "lm-studio" }
  vllm:     { base_url: "http://localhost:8001/v1",  api_key: "EMPTY" }
  llamacpp: { base_url: "http://localhost:8080/v1",  api_key: "none" }
default_backend: ollama

# Model tiers per profile.
#   main      -> code and analysis (used by most agents)
#   fast      -> optional LLM router, search query generation
#   reasoning -> deep mode (Architect + quality gate). Same as main = no VRAM swap
#   vision    -> screenshots / mockups (optional)
#   embed     -> codebase RAG index
# A tier can also be { model: "...", backend: "vllm" } to mix different servers.
profiles:
  cpu:
    main: "qwen2.5-coder:3b"
    fast: "qwen2.5-coder:1.5b"
    reasoning: "qwen2.5-coder:7b"
    vision: "qwen2.5vl:3b"
    embed: "nomic-embed-text"
    num_ctx: 8192
    native_tools: false
  gpu8:
    main: "qwen2.5-coder:7b"
    fast: "qwen2.5-coder:1.5b"
    reasoning: "qwen2.5-coder:7b"   # thinking alternative: "qwen3:8b" (model swap in VRAM)
    vision: "qwen2.5vl:7b"
    embed: "nomic-embed-text"
    num_ctx: 16384
    native_tools: false
  gpu16:
    main: "qwen2.5-coder:14b"
    fast: "qwen2.5-coder:1.5b"
    reasoning: "qwen2.5-coder:14b"  # alternative: "qwen3:14b" or "deepseek-r1:14b"
    vision: "qwen2.5vl:7b"
    embed: "nomic-embed-text"
    num_ctx: 32768
    native_tools: true
  gpu24:
    main: "qwen3-coder:30b"         # MoE ~3B active parameters: high quality and very fast
    fast: "qwen2.5-coder:1.5b"
    reasoning: "qwen3-coder:30b"    # alternative: "qwen3:30b" (thinking) or "gpt-oss:20b"
    vision: "qwen2.5vl:7b"
    embed: "nomic-embed-text"
    num_ctx: 32768
    native_tools: true

# Execution modes (picked by the router, or forced with /fast /balanced /deep)
modes:
  fast:
    # a single LLM call: specialist + Formatter rules merged into the same prompt
    think: false
  balanced:
    gate: [reviewer]
    max_review_rounds: 1
    think: false
    docs: false
  deep:
    gate: [security, performance, edge_cases, reviewer]
    max_review_rounds: 2
    think: true
    docs: true
  ultra-deep:
    # 35 agents: see mydevagent/ultra.py and config/agents_ultra.yaml
    gate: [security, performance, edge_cases, reviewer, a11y_i18n, observability, threat_model, scalability, fact_checker, dependencies]
    max_review_rounds: 3
    think: true
    docs: true

router:
  default_mode: auto        # auto | fast | balanced | deep
  use_llm: false            # true = ask the "fast" model when the heuristics are unsure
  fast_max_chars: 320       # shorter requests with a single domain -> fast
  deep_min_chars: 1500
  deep_min_domains: 4

context:
  history_turns: 4          # past conversation turns sent to the agents
  max_section_chars: 6000   # truncation of each blackboard section
  max_file_chars: 12000     # truncation of attached files
  max_history_chars: 1500   # per single history message

tools:
  web:
    enabled: true
    providers: [tavily, firecrawl, searxng, duckduckgo]   # fallback order
    max_results: 5
    fetch_top_n: 1          # how many pages to read in full (0 = snippets only)
    max_page_chars: 6000
    allow_private_urls: false   # block localhost/private IPs (anti-SSRF)
    timeout_s: 12
  connectivity:
    check_url: "https://www.gstatic.com/generate_204"
    timeout_s: 2.0
    cache_s: 60
  sandbox:
    enabled: true
    backend: docker          # docker | local (local = subprocess, ONLY if allow_unsafe_local)
    allow_unsafe_local: false
    timeout_s: 20
    memory: "512m"
    cpus: 1.0
    images:
      python: "python:3.12-slim"
      javascript: "node:22-slim"
      bash: "alpine:3.20"
  filesystem:
    root: "."
    allow_write: false
  git:
    allow_commit: false
  rag:
    enabled: true
    index_dir: ".mydevagent"
    top_k: 6
    chunk_lines: 60
    chunk_overlap: 10
  # Python modules with custom tools (@tool decorator), e.g. ["my_tools.jira"]
  custom: []

server:
  host: "127.0.0.1"
  port: 8000
  show_progress: true       # show an agent progress line in the reply
