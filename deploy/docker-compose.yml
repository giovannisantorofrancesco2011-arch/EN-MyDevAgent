# MyDevAgent full stack: Ollama (models) + SearXNG (free and private web search) + server MyDevAgent
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5-coder:7b
#   (repeat for qwen2.5-coder:1.5b and nomic-embed-text)  →  http://localhost:8000/v1
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "3"        # agents in parallel on the same model
      OLLAMA_CONTEXT_LENGTH: "16384"
    # NVIDIA GPU (requires nvidia-container-toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]

  mydevagent:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: [ollama, searxng]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LLM_BASE_URL: "http://ollama:11434/v1"
      SEARXNG_URL: "http://searxng:8080"
      MYDEVAGENT_PROFILE: "${MYDEVAGENT_PROFILE:-gpu8}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      MYDEVAGENT_API_KEY: "${MYDEVAGENT_API_KEY:-}"
    # The Docker sandbox inside the container needs the Docker socket: it gives the container
    # control of the host's daemon. Only enable it if you know what you're doing.
    # volumes: ["/var/run/docker.sock:/var/run/docker.sock"]

volumes:
  ollama:
