# Continue.dev (VS Code / JetBrains) — copy to ~/.continue/config.yaml
# Prerequisites:  `mydevagent serve` running  +  Ollama with your profile's models
name: MyDevAgent
version: 1.0.0
schema: v1

models:
  # Chat: the full 15-agent team (automatic fast/balanced/deep router)
  - name: MyDevAgent (15-agent team)
    provider: openai
    model: mydevagent
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local            # put MYDEVAGENT_API_KEY here if you set it
    roles: [chat]
    defaultCompletionOptions:
      contextLength: 16384
      maxTokens: 4096

  # Deep: forces the full pipeline (architecture, security, performance, edge cases, docs)
  - name: MyDevAgent Deep
    provider: openai
    model: mydevagent-deep
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local
    roles: [chat]

  # Inline Edit / Apply: a single call → fast
  - name: MyDevAgent Fast
    provider: openai
    model: mydevagent-fast
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local
    roles: [chat, edit, apply]

  # Autocomplete (tab): small BASE model with FIM, straight from Ollama → latenza ~100-300 ms
  - name: Qwen2.5-Coder 1.5B (autocomplete)
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles: [autocomplete]
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      onlyMyCode: true

  # Embeddings for @codebase
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text
    roles: [embed]

context:
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
  - provider: currentFile

rules:
  - Reply in English, with code and comments in English.
  - Use the @security @perf @db @web tags in the message to bring in specific agents.
