<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDevAgent · multiplayer</title>
<style>
  :root { --bg: #15111b; --panel: #1f1928; --line: #3a2d4d; --text: #e8e3ef; --dim: #8e869b; --accent: #a855f7; --soft: #e9d5ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #7e22ce; }
  header svg { width: 46px; height: 46px; flex: none; }
  #who { font-weight: 600; color: var(--soft); }
  #vio { color: var(--dim); font-size: 14px; }
  #status { margin-left: auto; font-size: 13px; color: var(--dim); white-space: nowrap; }
  #status::before { content: "●"; margin-right: 6px; color: #e0b04a; }
  #status.on::before { color: #6fbf73; }
  main { flex: 1; overflow-y: auto; padding: 12px 16px 4px; }
  #feed { max-width: 900px; margin: 0 auto; }
  .term { margin: 0; color: #d9d9d9; white-space: pre; overflow-x: auto;
          font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .msg { margin: 14px 0 8px; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--panel);
         border-radius: 0 8px 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg b { color: var(--accent); display: block; font-size: 13px; }
  .msg.me { border-left-color: #6fbf73; }
  .msg.me b { color: #6fbf73; }
  .sys { color: var(--dim); font-size: 13px; margin: 6px 0; }
  .sys::before { content: "⎿  "; }
  #busy { max-width: 900px; margin: 8px auto; color: var(--accent); font-size: 14px; }
  #busy::after { content: "…"; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.2em; } }
  footer { border-top: 1px solid #7e22ce; padding: 10px 16px 12px; }
  form#composer { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
  textarea, input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                    padding: 10px 12px; font: inherit; }
  textarea { resize: none; min-height: 46px; max-height: 180px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 900px; margin: 6px auto 0; color: var(--dim); font-size: 12px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid #7e22ce; border-radius: 12px; padding: 22px; width: min(380px, 92vw); }
  dialog::backdrop { background: rgb(10 6 16 / 80%); }
  dialog h1 { margin: 0 0 4px; font-size: 20px; color: var(--soft); }
  dialog p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
  dialog label { display: block; font-size: 13px; color: var(--dim); margin: 10px 0 4px; }
  dialog input { width: 100%; }
  dialog button { width: 100%; padding: 11px; margin-top: 16px; }
  #join-error { color: #f87171; font-size: 14px; margin: 10px 0 0; min-height: 1em; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M12 36a20 20 0 0 1 40 0v4H12z" fill="#a855f7"/>
    <path d="M14 40c0 7-4 11-7 13M23 41c0 8-2 12-5 15M32 41v16M41 41c0 8 2 12 5 15M50 40c0 7 4 11 7 13"
          stroke="#a855f7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="31" r="4.5" fill="#fff"/><circle cx="39" cy="31" r="4.5" fill="#fff"/>
    <circle cx="26" cy="32" r="2.2" fill="#15111b"/><circle cx="40" cy="32" r="2.2" fill="#15111b"/>
  </svg>
  <div>
    <div id="who">MyDevAgent</div>
    <div id="vio">Vio is waiting for you…</div>
  </div>
  <div id="status">not connected</div>
</header>
<main id="scroll">
  <div id="feed"></div>
  <div id="busy" hidden>Vio is working</div>
</main>
<footer>
  <form id="composer">
    <textarea id="text" rows="1" placeholder="Write to the agent…" disabled></textarea>
    <button id="send" disabled>Send</button>
  </form>
  <div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div>
</footer>

<dialog id="join">
  <form id="join-form">
    <h1>Join the session</h1>
    <p>You'll see what the agent does and you can write to it. File changes are confirmed by whoever invited you.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="20" autocomplete="nickname" required>
    <label for="code">Code</label>
    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" required>
    <div id="join-error"></div>
    <button>Join</button>
  </form>
</dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const scroller = $("scroll");
  let code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
  let name = "";
  let host = "";
  try { name = localStorage.getItem("mydevagent-name") || ""; } catch (e) {}

  async function post(path, extra) {
    let response;
    try {
      response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ code: code, name: name, ...extra }) });
    } catch (e) {
      throw new Error("Can't reach the session: are you on the same Wi-Fi network? Is it still open?");
    }
    if (response.status === 403) throw new Error("Wrong code: check the one you were given.");
    if (response.status === 429) throw new Error("Too many wrong attempts: ask for the link again.");
    if (!response.ok) throw new Error("Something went wrong (error " + response.status + ").");
    return response.json();
  }

  function add(el) {
    const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
    $("feed").append(el);
    if (atBottom) scroller.scrollTop = scroller.scrollHeight;
  }

  function show(item) {
    if (item.kind === "vio") { $("vio").textContent = "Vio: " + item.text; return; }
    if (item.kind === "busy") { $("busy").hidden = !item.on; if (item.on) scroller.scrollTop = scroller.scrollHeight; return; }
    let el;
    if (item.kind === "html") {  // the host's terminal, already converted (and escaped) by MyDevAgent
      el = document.createElement("pre");
      el.className = "term";
      el.innerHTML = item.html;
    } else if (item.kind === "message") {
      el = document.createElement("div");
      el.className = "msg" + (item.who === name ? " me" : "");
      const who = document.createElement("b");
      who.textContent = item.who === name ? item.who + " (you)" : item.who;
      el.append(who, item.text);
    } else if (item.kind === "system") {
      el = document.createElement("div");
      el.className = "sys";
      el.textContent = item.text;
    } else return;
    add(el);
  }

  function connect() {
    $("who").textContent = host + "'s session";
    document.title = host + "'s session · MyDevAgent";
    $("hint").textContent = "Enter to send · Shift+Enter for a new line · changes and commands are confirmed by " + host;
    $("text").disabled = $("send").disabled = false;
    $("text").focus();
    const events = new EventSource("/events?code=" + encodeURIComponent(code));
    events.onmessage = (e) => show(JSON.parse(e.data));
    events.onopen = () => { $("status").textContent = "connected"; $("status").className = "on"; };
    events.onerror = () => { $("status").textContent = "reconnecting…"; $("status").className = ""; };
  }

  async function join() {
    const result = await post("/join", {});
    name = result.name;
    host = result.host;
    try { localStorage.setItem("mydevagent-name", name); } catch (e) {}
    history.replaceState(null, "", "?code=" + encodeURIComponent(code));
    connect();
  }

  $("join-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    name = $("name").value.trim();
    code = $("code").value.trim().toUpperCase();
    try { await join(); $("join").close(); }
    catch (err) { $("join-error").textContent = err.message; }
  });

  async function send() {
    const text = $("text").value.trim();
    if (!text) return;
    $("send").disabled = true;
    try { await post("/send", { text: text }); $("text").value = ""; grow(); }
    catch (err) { show({ kind: "system", text: err.message }); }
    finally { $("send").disabled = false; $("text").focus(); }
  }

  function grow() {
    const t = $("text");
    t.style.height = "auto";
    t.style.height = t.scrollHeight + 2 + "px";
  }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  $("text").addEventListener("input", grow);
  $("text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  $("name").value = name;
  $("code").value = code;
  if (name && code) join().catch((err) => { $("join-error").textContent = err.message; $("join").showModal(); });
  else { $("join").showModal(); (name ? $("code") : $("name")).focus(); }
</script>
</body>
</html>
